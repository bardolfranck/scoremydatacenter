name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Provenance headers
        run: make headers-check

      - name: Tests
        run: make test

      # 🔴 PAS d'étape `make build` ici — décision Franck, 2026-10-28.
      # La CI checkoute le dépôt PUBLIC seul ; le corpus vit dans smdc-newsroom (privé).
      # `make build` tombait donc toujours sur son repli `score` et construisait le site sur
      # ZÉRO fiche : un build qui ne valide pas ce qu'on publie. Il est resté vert tant qu'il
      # plantait sur rien, puis rouge 29 runs d'affilée dès qu'une page a lu un périmètre
      # qu'un corpus vide n'émet pas — bloquant toutes les PR pour un défaut qui n'existait
      # pas en production. Le vrai garde-fou est ailleurs, et il est tenu : `make deploy`
      # lance la suite PUIS le build, en local, sur le corpus réel, AVANT toute mise en ligne.
      # Ne pas réintroduire cette étape en donnant le dépôt privé à la CI : les PR de forks
      # exécutent du code non relu, et NEWSROOM_TOKEN y donnerait accès au corpus entier.
      # Ce qui n'est donc plus couvert ici : une page .astro cassée n'est vue qu'au deploy.
