[project]
name = "smdc-engine"
version = "0.0.1"
description = "ScoreMyDataCenter scoring engine — validation, normalization, dual grading, confidence, audit artifacts"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "jsonschema>=4",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    # Comparateur (scripts/build_comparator.py) : distances et imputation du chemin CHAUD,
    # celui que `make prod-artifacts` rejoue à chaque build. UMAP et son numba restent dehors,
    # dans le chemin froid — la projection vit en cache dans le newsroom.
    "numpy>=2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# Chemin FROID du comparateur, tenu HORS des dépendances du projet et hors du groupe par
# défaut : umap-learn tire numba et llvmlite, et `uv run` n'installe un groupe nommé que si
# on le demande (`--group projection`). Une mise en ligne ne porte donc jamais cette pile,
# mais la commande documentée `make comparator-projection` tourne telle quelle — sans quoi
# un cache périmé bloque le build, ce qui est arrivé le 2026-10-02 au passage de GB à 137.
projection = [
    "umap-learn>=0.5",
]
# Transformations de DATUM, chemin FROID de collecte — hors dépendances par défaut, même
# discipline qu'umap : une mise en ligne ne porte jamais cette pile.
#   make locate-gb-ea   /   uv run --group geo python -m pipelines.registers.gb_ea
# Raison d'être : le registre EA des installations à permis publie l'Easting/Northing en
# OSGB36 (EPSG:27700) et nos fiches sont en WGS84. Une conversion maison entre ces deux
# systèmes ignore le décalage de datum et se trompe de l'ordre de 100 m — soit, avec un
# rayon d'appariement de 250 m, le permis du VOISIN attribué à notre site. Le commentaire
# de pipelines/registers/index.py le dit déjà pour le WFS : « une reprojection maison est
# exactement le genre de calcul silencieux qui a déjà produit des coordonnées fabriquées
# dans ce projet ». pyproj est l'outil juste, et il resservira (géo-audit, bandes, qualité
# de coordonnée).
geo = [
    "pyproj>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["."]
